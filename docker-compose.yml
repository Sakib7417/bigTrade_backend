services:
  postgres:
    image: postgres:16-alpine
    container_name: bigtrade_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-investment_db}
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: run the backend in Docker too (docker compose --profile app up -d)
  app:
    profiles: ["app"]
    build: .
    container_name: bigtrade_api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5010
      # Override: inside Docker the DB host is the postgres service, not localhost
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-investment_db}
    ports:
      - "5000:5000"
    command: sh -c "npx prisma migrate deploy && node src/server.js"

volumes:
  postgres_data:
    driver: local
